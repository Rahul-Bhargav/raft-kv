[project]
name = "raft-kv"
version = "0.1.0"
description = "A hand-written Raft implementation that replicates a key-value store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
